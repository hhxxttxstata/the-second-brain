# Personal Knowledge Agent — Docker Compose 一键启动
#   1. cp .env.example .env   （配置 LLM_API_KEY）
#   2. docker compose up -d --build
#   3. 浏览器打开 http://127.0.0.1:8000/workspace/
#
# Docker Desktop 开机自启 + restart: unless-stopped ⇒ Docker 启动即自动拉起网站
# agent_data / vault 直接 bind mount 宿主机目录：容器与本地开发共享同一份记忆与笔记
services:
  agent:
    build: .
    container_name: personal-knowledge-agent
    ports:
      - "8000:8000"    # Workspace UI (/workspace/) + FastAPI 后端
    env_file:
      - .env
    environment:
      AGENT_DATA_DIR: /app/agent_data
      # 宿主机 vault 路径（.env 未配置时用本地默认 D:/MYWORLD）
      OBSIDIAN_VAULT: ${OBSIDIAN_VAULT:-D:/MYWORLD}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    volumes:
      # SQLite WAL 无法在 Windows bind mount 上运行（disk I/O error）→ 用命名卷。
      # 首次部署用本地 agent_data 播种（见 docs），容器与本地数据以此卷为准。
      - agent_data:/app/agent_data
      # Obsidian vault：markdown 无 SQLite 限制，直接 bind mount 本地笔记库
      - ${OBSIDIAN_VAULT:-D:/MYWORLD}:/app/vault
    restart: unless-stopped

volumes:
  agent_data:
    name: pka-agent-data-v2
