name: Golden Regression

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Fast Suite (PR)：无 LLM 的单元层 + schema 校验（Evaluation Lifecycle §P1-3）──
  fast-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 跑 pytest 单元测试（LLM 全 mock，无需 API key）
        run: |
          python -X utf8 -m pytest tests/ -q --tb=short

      - name: 校验评测数据集 schema
        run: |
          python -X utf8 -c "
          import json, glob, os
          files = [f for f in glob.glob('agent_data/eval/*/*.json')
                   if '/meta/' not in f.replace(os.sep, '/')]
          assert files, '未找到任何评测数据集文件'
          for f in files:
              data = json.load(open(f, encoding='utf-8'))
              arr = data if isinstance(data, list) else [data]
              for c in arr:
                  assert 'input' in c, f'{f}: case 缺 input'
          print(f'schema OK: {len(files)} 个数据集文件')"

  # ── Full Suite (push to master)：golden + 隔离评测（真实 LLM）──
  eval:
    needs: fast-suite
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 准备评测环境（最小 vault + DB）
        env:
          OBSIDIAN_VAULT: /tmp/test_vault
        run: |
          # 最小 vault：日记检索用例需要
          mkdir -p /tmp/test_vault/diaries /tmp/test_vault/notes
          echo "# 测试日记" > /tmp/test_vault/diaries/$(date +%F).md
          echo "今天看了 RAG 相关的资料。" >> /tmp/test_vault/diaries/$(date +%F).md
          echo "# RAG 笔记" > /tmp/test_vault/notes/rag-notes.md
          echo "Retrieval-Augmented Generation 要点。" >> /tmp/test_vault/notes/rag-notes.md
          # 初始化 SQLite
          python -X utf8 -c "from app.agent.memory_store import init_db; init_db(); print('DB ready')"

      - name: 跑 Golden 回归（隔离模式，防自进化污染）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: deepseek-v4-flash
          LLM_BASE_URL: https://api.deepseek.com/v1
          OBSIDIAN_VAULT: /tmp/test_vault
        run: |
          python -X utf8 -m app.cli eval

      - name: 失败时输出详情
        if: failure()
        run: |
          ls -la agent_data/benchmark/ 2>/dev/null | tail -5
          cat agent_data/benchmark/benchmark_*.json 2>/dev/null | head -100
